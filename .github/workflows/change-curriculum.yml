# Schimba linkul curriculei din conf/widget.json, apoi reface profilul de
# competente si joburile prin workflow-ul de reimprospatare.
name: 4. Schimba linkul curriculei

on:
  workflow_dispatch:
    inputs:
      curriculum_url:
        description: 'Linkul nou catre planul de invatamant al facultatii'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Actualizeaza curriculumUrl
        env:
          CURRICULUM_URL: ${{ inputs.curriculum_url }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "fs";
            const CONFIG_PATH = "conf/widget.json";
            const url = process.env.CURRICULUM_URL.trim();
            if (!/^https?:\/\/\S+$/i.test(url)) {
              console.error(`::error::Link invalid: "${url}". Trebuie sa inceapa cu http:// sau https://`);
              process.exit(1);
            }
            const config = JSON.parse(readFileSync(CONFIG_PATH, "utf-8"));
            console.log(`curriculumUrl: "${config.curriculumUrl || ""}" -> "${url}"`);
            config.curriculumUrl = url;
            writeFileSync(CONFIG_PATH, JSON.stringify(config, null, 2) + "\n", "utf-8");
          '

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conf/widget.json
          if git diff --cached --quiet; then
            echo "Linkul este deja acelasi, refac doar profilul si joburile"
          else
            git commit -m "config: schimba linkul curriculei"
            git push
          fi

  refresh:
    needs: update
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/refresh-jobs.yml
    with:
      # Profilul s-ar reface oricum la schimbarea linkului, dar fortam recitirea
      # si cand linkul e acelasi (ex: PDF-ul de la aceeasi adresa a fost actualizat)
      reface_profil: true
    # fara asta, deploy.yml (apelat din refresh-jobs) nu vede WIDGET_TOKEN
    secrets: inherit
